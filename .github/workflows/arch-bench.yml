name: escape-filter across architectures

# Does the jackson-core#1707 getChars() change, and the 64K escape table, behave the same on
# aarch64 as on x86-64? On x86 charAt compiles to movsbl+movzbl (two instructions) while a char[]
# read is one movzwl, which is where getChars() earns its keep. aarch64's ldrb zero-extends
# natively, so that saving may not exist there. This workflow measures it instead of guessing.

on:
  # workflow_dispatch only works from the default branch, so a push to this branch triggers it too.
  push:
    branches: [ 'ci/arch-bench' ]
  workflow_dispatch:
    inputs:
      forks:
        description: JMH forks per arm
        default: "5"
      arms:
        description: space-separated arms
        default: "base const t64k gc gct64k gcconst"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 measured in run 34900140779; uncomment to re-run both architectures together
          # - { os: ubuntu-24.04,     arch: x86_64  }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-14,         arch: aarch64 }
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Environment
        run: |
          uname -a
          java -version 2>&1
          echo "--- cpu"
          (lscpu 2>/dev/null || sysctl -a | grep -E 'machdep.cpu|hw.model|hw.ncpu') | head -25

      - name: Build variants
        run: ./ci/build-variants.sh ${{ inputs.arms  || 'base const t64k gc gct64k gcconst' }}

      - name: Output must be byte-identical to unpatched Jackson
        run: ./ci/check-variants.sh

      - name: Throughput
        run: |
          mkdir -p results
          for arm in ${{ inputs.arms  || 'base const t64k gc gct64k gcconst' }}; do
            for sl in 0 64; do
              echo "=== $arm strLen=$sl"
              java -jar target/bench-$arm.jar 'ExtendedPersonBench.serialize$' \
                -p strLen=$sl \
                -f ${{ inputs.forks || '5' }} -wi 5 -i 5 -r 1 \
                -rf json -rff results/$arm-len$sl.json 2>&1 | tail -3
            done
          done

      # Instructions per op answers the aarch64 question without needing a disassembler: if getChars()
      # saves an instruction per character on x86 but not on ARM, it shows up here.
      # perfnorm reads '#slots' - an x86 topdown-methodology event absent on aarch64 - and refuses to
      # initialize without it ("Failure to read '#slots'"). Naming events explicitly does NOT avoid it,
      # so use useDefaultStat, which runs "perf stat -d -d -d" instead of an explicit counter list.
      - name: Hardware counters (Linux only, best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-common linux-tools-generic || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          echo "perf_event_paranoid = $(cat /proc/sys/kernel/perf_event_paranoid)"
          perf --version || echo "perf unavailable"
          # Does perf actually collect anything here? JMH swallows the failure, so ask directly.
          perf stat -e instructions,cycles true || echo "perf stat FAILED - counters unavailable on this runner"
          for arm in ${{ inputs.arms  || 'base const t64k gc gct64k gcconst' }}; do
            for sl in 0 64; do
              echo "=== $arm strLen=$sl"
              # Do NOT filter: a grep here hides whatever perfnorm is complaining about.
              java -jar target/bench-$arm.jar 'ExtendedPersonBench.serialize$' \
                -p strLen=$sl -f 2 -wi 3 -i 3 -r 1 \
                -prof 'perfnorm:useDefaultStat=true' > perfnorm-$arm-len$sl.log 2>&1 \
                || echo "perfnorm exited non-zero for $arm len$sl"
              grep -E 'serialize:(instructions|cycles|IPC|CPI|branch)' perfnorm-$arm-len$sl.log || tail -15 perfnorm-$arm-len$sl.log
              # Fallback: raw perf stat totals, in case perfnorm still cannot initialize.
              java -jar target/bench-$arm.jar 'ExtendedPersonBench.serialize$' \
                -p strLen=$sl -f 1 -wi 3 -i 3 -r 1 -prof perf > perf-$arm-len$sl.log 2>&1 \
                || echo "perf profiler exited non-zero for $arm len$sl"
              grep -E '^ +[0-9,]+ +(instructions|cycles|branch)' perf-$arm-len$sl.log | head -4 || true
            done
          done


      # The JMH perf profilers cannot initialize on aarch64 (they read '#slots'), but plain JVM
      # diagnostic flags work anywhere and need neither perf nor hsdis. Inlining and nmethod sizes are
      # decided from bytecode size and profiles, so they are comparable across architectures - and the
      # two arms that disagree between x86 and ARM are const and t64k.
      - name: Compilation shape (no perf, no hsdis needed)
        continue-on-error: true
        run: |
          echo "=== is hsdis present anywhere?"
          find / -name 'hsdis*' 2>/dev/null | head -5 || true
          ls "$JAVA_HOME"/lib/hsdis* 2>/dev/null || echo "none in JAVA_HOME/lib"
          for arm in const t64k; do
            echo "########## $arm"
            java -jar target/bench-$arm.jar 'ExtendedPersonBench.serialize$' \
              -p strLen=64 -f 1 -wi 3 -i 3 -r 1 \
              -jvmArgsAppend '-XX:+UnlockDiagnosticVMOptions -XX:+PrintCompilation -XX:+PrintInlining' \
              > shape-$arm.log 2>&1 || echo "run failed for $arm"
            echo "--- nmethod sizes for the methods that carry the copy loop:"
            grep -E 'UTF8JsonGenerator::(writeString|_writeStringSegment)|MapperUtil::serializePojo|ExtendedPersonSer::serializeContent' shape-$arm.log \
              | grep -vE '@|inline|failed' | tail -12
            echo "--- inlining decisions around the copy loop:"
            grep -E '_writeStringSegment|writeString' shape-$arm.log | grep -E 'inline|too big|hot method too big|already compiled' | tail -12
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            results/
            perfnorm-*.log
            perf-*.log
            shape-*.log
